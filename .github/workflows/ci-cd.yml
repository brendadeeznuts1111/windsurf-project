name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # QUALITY ASSURANCE
  # ============================================================================

  quality-check:
    name: Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Type Check
        run: bun run lint

      - name: Security Audit
        run: bun audit || echo "Audit completed with warnings"

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-results
          path: reports/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-check
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test --coverage --reporter=junit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: bun run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            coverage/
            reports/test-results.xml
            reports/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-check
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run MIME API benchmarks
        run: bun run benchmarks/bun-mime-api-constants.benchmark.test.ts

      - name: Run file operation benchmarks
        run: bun test benchmarks/bun-file-mime.benchmark.test.ts

      - name: Run comprehensive benchmarks
        run: bun run benchmarks/bun-performance-benchmark-comprehensive.ts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: reports/benchmarks/

  # ============================================================================
  # BUILD & DEPLOYMENT
  # ============================================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, security-scan, benchmark]
    if: github.event_name == 'push' || github.event.inputs.environment

    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: cd apps/dashboard && bun run build

      - name: Build CLI tools
        run: bun run build

      - name: Run build tests
        run: bun test --build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            dist/
            apps/dashboard/dist/
            build/

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'development' }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event.inputs.environment) && needs.build.result == 'success'
    environment:
      name: ${{ github.event.inputs.environment || 'development' }}
      url: ${{ github.event.inputs.environment == 'production' && 'https://bun-ecosystem.com' || github.event.inputs.environment == 'staging' && 'https://staging.bun-ecosystem.com' || 'https://dev.bun-ecosystem.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-ubuntu-latest-${{ github.run_id }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy dashboard
        run: |
          aws s3 sync apps/dashboard/dist/ s3://bun-ecosystem-${{ github.event.inputs.environment || 'dev' }}-dashboard --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"

      - name: Run smoke tests
        run: |
          DEPLOY_URL="${{ github.event.inputs.environment == 'production' && 'https://bun-ecosystem.com' || github.event.inputs.environment == 'staging' && 'https://staging.bun-ecosystem.com' || 'https://dev.bun-ecosystem.com' }}"
          curl -f $DEPLOY_URL/api/health || exit 1
          echo "✅ Deployment to ${{ github.event.inputs.environment || 'development' }} successful"

      - name: Notify deployment
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"🚀 Deployed ${{ github.event.inputs.environment || '\''development'\'' }}: ${{ github.sha }}"}'

  # ============================================================================
  # QUALITY GATES
  # ============================================================================

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [test, benchmark, security-scan]
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.run_id }}

      - name: Check test coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "0")
            if (( $(echo "$COVERAGE < 80" | bc -l 2>/dev/null || echo "1") )); then
              echo "❌ Test coverage too low: ${COVERAGE}% (required: 80%)"
              exit 1
            fi
            echo "✅ Test coverage: ${COVERAGE}%"
          fi

      - name: Check security score
        run: |
          # Placeholder for security score checking
          echo "✅ Security checks passed"

      - name: Generate quality report
        run: |
          echo "## Quality Gate Report" > quality-report.md
          echo "- Tests: ${{ needs.test.result }}" >> quality-report.md
          echo "- Security: ${{ needs.security-scan.result }}" >> quality-report.md
          echo "- Benchmarks: ${{ needs.benchmark.result }}" >> quality-report.md

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: quality-report.md