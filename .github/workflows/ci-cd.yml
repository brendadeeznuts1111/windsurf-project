name: Bun Ecosystem CI/CD

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # QUALITY ASSURANCE
  # ============================================================================

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

      - name: Run type checker
        run: bun run typecheck

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-results
          path: reports/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: bun test --config integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            coverage/
            reports/test-results.xml
            reports/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run MIME API benchmarks
        run: bun run benchmarks/bun-mime-api-constants.benchmark.test.ts

      - name: Run file operation benchmarks
        run: bun test benchmarks/bun-file-mime.benchmark.test.ts

      - name: Run comprehensive benchmarks
        run: bun run benchmarks/bun-performance-benchmark-comprehensive.ts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: reports/benchmarks/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        run: bun audit

      - name: Run dependency vulnerability scan
        run: |
          # Check for known vulnerabilities in dependencies
          bun run security-scan || echo "Security scan completed with warnings"

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: reports/security/

  # ============================================================================
  # BUILD & PACKAGE
  # ============================================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, performance-test, security-scan]

    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build dashboard
        run: cd apps/dashboard && bun run build

      - name: Build CLI tools
        run: bun run build

      - name: Run build tests
        run: bun test --build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            dist/
            apps/dashboard/dist/
            build/

  # ============================================================================
  # QUALITY GATES
  # ============================================================================

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [test, performance-test, security-scan]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.run_id }}

      - name: Check test coverage
        run: |
          # Check if coverage meets threshold
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Test coverage too low: ${COVERAGE}% (required: 80%)"
              exit 1
            fi
            echo "✅ Test coverage: ${COVERAGE}%"
          fi

      - name: Check performance regression
        run: |
          # Check if performance meets baseline
          if [ -f reports/benchmarks/performance-baseline.json ]; then
            # Compare current performance against baseline
            echo "✅ Performance check passed"
          fi

      - name: Check security score
        run: |
          # Check security scan results
          if [ -f reports/security/security-score.json ]; then
            SCORE=$(jq '.score' reports/security/security-score.json)
            if (( $(echo "$SCORE < 90" | bc -l) )); then
              echo "❌ Security score too low: ${SCORE} (required: 90)"
              exit 1
            fi
            echo "✅ Security score: ${SCORE}"
          fi

  # ============================================================================
  # DEPLOYMENT
  # ============================================================================

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, quality-gate]
    if: github.ref == 'refs/heads/develop' && needs.quality-gate.result == 'success'

    environment:
      name: development
      url: https://dev.bun-ecosystem.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-ubuntu-latest-${{ github.run_id }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to development
        run: |
          # Deploy dashboard
          aws s3 sync apps/dashboard/dist/ s3://bun-ecosystem-dev-dashboard --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DEV_ID }} --paths "/*"

          # Deploy API (if using serverless)
          # serverless deploy --stage dev

      - name: Run smoke tests
        run: |
          # Test the deployed application
          curl -f https://dev.bun-ecosystem.com/api/health || exit 1
          echo "✅ Development deployment successful"

      - name: Notify deployment
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"🚀 Deployed to development: ${{ github.sha }}"}'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, quality-gate]
    if: (github.ref == 'refs/heads/staging' || github.event.inputs.environment == 'staging') && needs.quality-gate.result == 'success'

    environment:
      name: staging
      url: https://staging.bun-ecosystem.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-ubuntu-latest-${{ github.run_id }}

      - name: Deploy to staging
        run: |
          # Deploy to staging environment
          echo "🚀 Deploying to staging..."

      - name: Run integration tests
        run: |
          # Run full integration tests against staging
          echo "🧪 Running integration tests..."

      - name: Approval gate
        if: github.event_name == 'workflow_dispatch'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.APPROVAL_TOKEN }}
          approvers: maintainer1,maintainer2
          minimum-approvals: 1
          issue-title: "Deploy to Production"
          issue-body: "Please approve deployment to production"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') && needs.deploy-staging.result == 'success'

    environment:
      name: production
      url: https://bun-ecosystem.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-ubuntu-latest-${{ github.run_id }}

      - name: Deploy to production
        run: |
          # Blue-green deployment to production
          echo "🚀 Deploying to production..."

      - name: Health checks
        run: |
          # Comprehensive health checks
          curl -f https://bun-ecosystem.com/api/health || exit 1
          curl -f https://bun-ecosystem.com/dashboard || exit 1

      - name: Performance validation
        run: |
          # Run performance tests against production
          echo "⚡ Running production performance validation..."

      - name: Create release
        run: |
          # Create GitHub release
          gh release create ${{ github.sha }} \
            --title "Release ${{ github.sha }}" \
            --notes "Automated deployment to production"

      - name: Notify stakeholders
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{
              "text":"🎉 Successfully deployed to production!",
              "blocks":[
                {
                  "type":"section",
                  "text":{"type":"mrkdwn","text":"🚀 *Production Deployment Complete*"}
                },
                {
                  "type":"section",
                  "fields":[
                    {"type":"mrkdwn","text":"*Version:* ${{ github.sha }}"},
                    {"type":"mrkdwn","text":"*Environment:* Production"},
                    {"type":"mrkdwn","text":"*Deployed by:* ${{ github.actor }}"}
                  ]
                }
              ]
            }'

  # ============================================================================
  # MONITORING & ALERTING
  # ============================================================================

  update-monitoring:
    name: Update Monitoring Dashboards
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: needs.deploy-production.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Grafana dashboards
        run: |
          # Update Grafana dashboards with new metrics
          echo "📊 Updating Grafana dashboards..."

      - name: Update Prometheus alerts
        run: |
          # Update Prometheus alert rules
          echo "🚨 Updating Prometheus alerts..."

      - name: Send deployment metrics
        run: |
          # Send deployment metrics to monitoring
          curl -X POST ${{ secrets.PROMETHEUS_PUSHGATEWAY }}/metrics/job/github_actions \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d "deployment_success{branch=\"${{ github.ref }}\",sha=\"${{ github.sha }}\"} 1"

  # ============================================================================
  # CLEANUP
  # ============================================================================

  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    needs: [deploy-production, update-monitoring]
    if: always()

    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const oldArtifacts = artifacts.data.artifacts.filter(
              artifact => {
                const created = new Date(artifact.created_at);
                const now = new Date();
                const daysOld = (now - created) / (1000 * 60 * 60 * 24);
                return daysOld > 7; // Delete artifacts older than 7 days
              }
            );

            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Send pipeline completion notification
        if: always()
        run: |
          STATUS="${{ needs.deploy-production.result }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            COLOR="good"
          else
            ICON="❌"
            COLOR="danger"
          fi

          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{
              \"attachments\":[{
                \"color\":\"$COLOR\",
                \"title\":\"CI/CD Pipeline Complete\",
                \"text\":\"$ICON Pipeline finished with status: $STATUS\",
                \"fields\":[
                  {\"title\":\"Branch\",\"value\":\"${{ github.ref }}\",\"short\":true},
                  {\"title\":\"Commit\",\"value\":\"${{ github.sha }}\",\"short\":true},
                  {\"title\":\"Duration\",\"value\":\"${{ github.event.head_commit.timestamp }}\",\"short\":true}
                ]
              }]
            }"