name: Community Health Check

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  health-check:
    name: Repository Health Metrics
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests and collect coverage
        run: bun test --coverage

      - name: Generate health report
        run: |
          echo "# Repository Health Report" > health-report.md
          echo "Generated on: $(date)" >> health-report.md
          echo "" >> health-report.md

          # Test coverage
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "0")
            echo "## Test Coverage" >> health-report.md
            echo "Lines: ${COVERAGE}%" >> health-report.md
            echo "" >> health-report.md
          fi

          # Code quality metrics
          echo "## Code Quality" >> health-report.md
          echo "- TypeScript strict mode: ✅ Enabled" >> health-report.md
          echo "- ESLint: ✅ Configured" >> health-report.md
          echo "- Prettier: ✅ Configured" >> health-report.md
          echo "" >> health-report.md

          # Performance benchmarks
          echo "## Performance Benchmarks" >> health-report.md
          echo "- HTTP Server: Target <2.5ms avg response" >> health-report.md
          echo "- WebSocket: Target 700k+ msg/sec" >> health-report.md
          echo "- Memory: Target <100MB baseline" >> health-report.md
          echo "" >> health-report.md

          # Community metrics
          echo "## Community Metrics" >> health-report.md
          echo "- Open issues: $(gh issue list --state open --limit 1000 | wc -l)" >> health-report.md
          echo "- Open PRs: $(gh pr list --state open --limit 1000 | wc -l)" >> health-report.md
          echo "- Contributors: $(gh api repos/${{ github.repository }}/contributors --paginate | jq 'length')" >> health-report.md
          echo "" >> health-report.md

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: health-report.md

      - name: Comment on health issues
        if: failure()
        run: |
          echo "Health check failed - issues detected"
          # In a real implementation, this would create issues or notifications