name: Cross-Reference Automation
on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/**'
      - 'tools/bun-cross-reference-builder.ts'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'tools/bun-cross-reference-builder.ts'

env:
  NODE_ENV: production
  BUN_VERSION: "1.3.2"

jobs:
  cross-reference-update:
    name: Update Cross-References
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for analysis

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run cross-reference builder
        run: bun run tools/bun-cross-reference-builder.ts

      - name: Check for catalog changes
        id: check_changes
        run: |
          if git diff --quiet examples/ENHANCED_EXAMPLES_CATALOG_v2.md; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✅ No catalog changes needed"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 Catalog updated with new cross-references"
          fi

      - name: Commit catalog updates
        if: steps.check_changes.outputs.changes == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Cross-Reference Builder"

          git add examples/ENHANCED_EXAMPLES_CATALOG_v2.md
          git add cross-reference-analysis-report.md

          git commit -m "🤖 Auto-update cross-references

Automated cross-reference update triggered by:
- Commit: ${GITHUB_SHA}
- Trigger: ${GITHUB_EVENT_NAME}
- Actor: ${GITHUB_ACTOR}

Changes:
- Updated example relationships based on API usage analysis
- Refreshed similarity scores and cross-references
- Regenerated analysis report with latest metrics

This commit was automatically generated by the Cross-Reference Builder CI."

          git push

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cross-reference-analysis
          path: |
            cross-reference-analysis-report.md
            examples/ENHANCED_EXAMPLES_CATALOG_v2.md
          retention-days: 30

      - name: Comment on PR with analysis
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🔗 Cross-Reference Analysis Updated\n\n';
            comment += 'The automated cross-reference builder has updated example relationships based on your changes.\n\n';

            // Check if analysis report exists
            if (fs.existsSync('cross-reference-analysis-report.md')) {
              const report = fs.readFileSync('cross-reference-analysis-report.md', 'utf8');

              // Extract key metrics
              const examplesMatch = report.match(/\*\*Total Examples Analyzed:\*\* (\d+)/);
              const relationshipsMatch = report.match(/Relationships created: (\d+)/);

              if (examplesMatch && relationshipsMatch) {
                comment += `### 📊 Analysis Summary\n\n`;
                comment += `- **Examples Analyzed**: ${examplesMatch[1]}\n`;
                comment += `- **Relationships Created**: ${relationshipsMatch[1]}\n`;
                comment += `- **Average Relationships**: ${(relationshipsMatch[1] / examplesMatch[1]).toFixed(1)} per example\n\n`;
              }
            }

            comment += `### 📋 What Changed\n\n`;
            comment += `- Updated cross-references between examples\n`;
            comment += `- Refreshed similarity scores based on API usage\n`;
            comment += `- Regenerated analysis report\n\n`;

            comment += `[View detailed analysis report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;

            comment += `*This update was automatically generated by the Cross-Reference Builder CI*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  validate-cross-references:
    name: Validate Cross-References
    runs-on: ubuntu-latest
    needs: [cross-reference-update]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate cross-reference integrity
        run: bun run tools/cross-reference-validator.ts

      - name: Check for broken links
        run: |
          echo "🔍 Checking for broken cross-reference links..."

          # Extract all links from catalog
          grep -o '\[.*\](\([^)]*\))' examples/ENHANCED_EXAMPLES_CATALOG_v2.md | while read -r line; do
            # Extract the path from the link
            path=$(echo "$line" | sed 's/.*(\([^)]*\)).*/\1/')

            # Check if file exists (skip external links)
            if [[ "$path" == examples/* ]] && [[ "$path" == *.ts ]] && [[ ! -f "$path" ]]; then
              echo "❌ Broken link: $line -> $path"
              exit 1
            fi
          done

          echo "✅ All cross-reference links are valid"

      - name: Performance check
        run: |
          echo "⚡ Checking cross-reference generation performance..."

          start_time=$(date +%s.%3N)

          # Run analysis only (fast operation)
          bun run tools/bun-cross-reference-builder.ts --analyze-only > /dev/null 2>&1

          end_time=$(date +%s.%3N)
          duration=$(echo "$end_time - $start_time" | bc)

          if (( $(echo "$duration > 30" | bc -l) )); then
            echo "❌ Cross-reference generation took too long: ${duration}s"
            exit 1
          else
            echo "✅ Cross-reference generation completed in ${duration}s"
          fi