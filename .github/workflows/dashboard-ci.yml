name: Dashboard CI/CD Pipeline
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-ci.yml'

env:
  NODE_ENV: test
  BUN_VERSION: "1.3.4"

jobs:
  # ===== DASHBOARD BUILD & TEST =====
  dashboard-test:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: TypeScript compilation check
        working-directory: apps/dashboard
        run: bunx tsc --noEmit

      - name: Lint code
        working-directory: apps/dashboard
        run: bun run lint

      - name: Run dashboard tests
        working-directory: apps/dashboard
        run: bun run test:all

      - name: Build dashboard
        working-directory: apps/dashboard
        run: bun run build

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dashboard-test-results
          path: apps/dashboard/test-reports/
          retention-days: 30

  # ===== DASHBOARD INTEGRATION TESTS =====
  dashboard-integration:
    name: Dashboard Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: dashboard-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        working-directory: apps/dashboard
        run: bun run build

      - name: Start dashboard server
        working-directory: apps/dashboard
        run: |
          bun run prod:server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5

      - name: Run integration tests
        working-directory: apps/dashboard
        run: bun run test:integration

      - name: Health check
        run: |
          curl -f http://localhost:3000/health || exit 1
          curl -f http://localhost:3000/api/health || exit 1

      - name: Stop server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  # ===== DASHBOARD PERFORMANCE TESTS =====
  dashboard-performance:
    name: Dashboard Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: dashboard-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        working-directory: apps/dashboard
        run: bun run build

      - name: Run performance tests
        working-directory: apps/dashboard
        run: bun run test:performance

      - name: Generate bundle analysis
        working-directory: apps/dashboard
        run: bun run build:analyze

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dashboard-performance-results
          path: |
            apps/dashboard/test-reports/
            apps/dashboard/dist/stats.html
          retention-days: 30

  # ===== SECURITY & QUALITY CHECKS =====
  dashboard-security:
    name: Dashboard Security & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: Security audit
        working-directory: apps/dashboard
        run: bun audit

      - name: Check for security vulnerabilities
        working-directory: apps/dashboard
        run: |
          # Check for hardcoded secrets
          if grep -r "password\|secret\|key\|token" apps/dashboard/src/ --exclude-dir=node_modules | grep -v "process.env" | grep -v "import.meta.env"; then
            echo "❌ Potential hardcoded secrets found"
            exit 1
          fi

      - name: Bundle size check
        working-directory: apps/dashboard
        run: |
          bun run build
          SIZE=$(du -sh dist/ | cut -f1)
          echo "📦 Bundle size: $SIZE"
          # Fail if bundle is too large (>50MB)
          if [ $(du -sm dist/ | cut -f1) -gt 50 ]; then
            echo "❌ Bundle size too large: $SIZE"
            exit 1
          fi

  # ===== DEPLOYMENT PREPARATION =====
  dashboard-deploy-prep:
    name: Dashboard Deploy Preparation
    runs-on: ubuntu-latest
    needs: [dashboard-test, dashboard-integration, dashboard-performance, dashboard-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: Build production bundle
        working-directory: apps/dashboard
        run: bun run build

      - name: Generate deployment artifact
        working-directory: apps/dashboard
        run: |
          tar -czf dashboard-deployment.tar.gz \
            dist/ \
            src/production-server.ts \
            src/api/ \
            src/utils/ \
            package.json \
            bun.lock \
            Dockerfile \
            fly.toml \
            vercel.json \
            .env.production

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v3
        with:
          name: dashboard-deployment-artifact
          path: apps/dashboard/dashboard-deployment.tar.gz
          retention-days: 7

  # ===== FLY.IO DEPLOYMENT =====
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: dashboard-deploy-prep
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v3
        with:
          name: dashboard-deployment-artifact
          path: apps/dashboard/

      - name: Extract deployment artifact
        working-directory: apps/dashboard
        run: tar -xzf dashboard-deployment.tar.gz

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: apps/dashboard
        run: fly deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check deployment
        run: |
          sleep 30
          curl -f https://bun-dashboard.fly.dev/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Dashboard deployed successfully to Fly.io"
          echo "🌐 URL: https://bun-dashboard.fly.dev"

  # ===== VERCEL DEPLOYMENT (ALTERNATIVE) =====
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: dashboard-deploy-prep
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && failure()
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v3
        with:
          name: dashboard-deployment-artifact
          path: apps/dashboard/

      - name: Extract deployment artifact
        working-directory: apps/dashboard
        run: tar -xzf dashboard-deployment.tar.gz

      - name: Setup Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        working-directory: apps/dashboard
        run: vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ===== POST-DEPLOYMENT VALIDATION =====
  post-deploy-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [deploy-fly, deploy-vercel]
    if: always() && (needs.deploy-fly.result == 'success' || needs.deploy-vercel.result == 'success')

    steps:
      - name: Determine deployment URL
        run: |
          if [ "${{ needs.deploy-fly.result }}" == "success" ]; then
            echo "DEPLOY_URL=https://bun-dashboard.fly.dev" >> $GITHUB_ENV
          elif [ "${{ needs.deploy-vercel.result }}" == "success" ]; then
            echo "DEPLOY_URL=https://bun-dashboard.vercel.app" >> $GITHUB_ENV
          fi

      - name: Validate deployment
        run: |
          echo "🔍 Validating deployment at: $DEPLOY_URL"

          # Health check
          curl -f $DEPLOY_URL/health || exit 1

          # API health
          curl -f $DEPLOY_URL/api/health || exit 1

          # Check main page loads
          curl -f $DEPLOY_URL/ | grep -q "Bun Dashboard" || exit 1

          echo "✅ Deployment validation successful"

      - name: Performance check
        run: |
          # Simple performance test
          TIME=$(curl -s -w "%{time_total}" -o /dev/null $DEPLOY_URL/)
          echo "⏱️  Response time: ${TIME}s"

          if (( $(echo "$TIME > 2.0" | bc -l) )); then
            echo "⚠️  Slow response time detected"
          else
            echo "✅ Response time acceptable"
          fi