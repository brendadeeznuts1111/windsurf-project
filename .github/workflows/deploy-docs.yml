name: Deploy Documentation Site

on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'tools/docs-site-generator.ts'
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'tools/docs-site-generator.ts'
      - 'docs-site/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Generate documentation site
      run: bun run tools/docs-site-generator.ts

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs-site
        cname: docs.bun.sh

    - name: Comment PR with preview link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { exec } = require('child_process');
          const { promisify } = require('util');
          const execAsync = promisify(exec);

          try {
            // Generate a preview URL for the PR
            const prNumber = context.issue.number;
            const previewUrl = `https://bun-docs-pr-${prNumber}.surge.sh`;

            // Deploy to Surge for PR previews
            await execAsync(`npx surge ./docs-site ${previewUrl} --token ${{ secrets.SURGE_TOKEN }}`);

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Documentation Site Preview**\n\nYour changes have been deployed to: ${previewUrl}\n\nThis preview will be available for the duration of this PR.`
            });
          } catch (error) {
            console.log('Preview deployment failed:', error);
          }