name: Deploy ULTRA-ARB Demo

on:
  push:
    branches: [ main ]
    paths:
      - 'interactive-demo.html'
      - '.github/workflows/deploy-ultra-arb-demo.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'interactive-demo.html'

jobs:
  deploy-demo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Create demo directory
      run: |
        mkdir -p demo
        cp interactive-demo.html demo/index.html

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./demo
        destination_dir: ultra-arb-demo

    - name: Comment PR with demo link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = context.issue.number;
          const demoUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/ultra-arb-demo/`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🎮 **ULTRA-ARB GLOBAL Interactive Demo**\n\nYour authentication system demo has been deployed to: ${demoUrl}\n\nThis preview will be available for the duration of this PR.`
          });