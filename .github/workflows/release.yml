name: Release Management

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto, patch, minor, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      create_github_release:
        description: 'Create GitHub release'
        required: false
        default: true
        type: boolean

jobs:
  # ============================================================================
  # SEMANTIC RELEASE
  # ============================================================================

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Determine release type
        id: release-type
        run: |
          if [ "${{ github.event.inputs.release_type }}" != "auto" ]; then
            echo "type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
          else
            # Auto-determine from commits
            COMMITS=$(git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")..HEAD)
            if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$COMMITS" | grep -qE "(feat|feature):"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create release
        run: |
          if [ "${{ steps.release-type.outputs.type }}" = "major" ]; then
            bun run version:major
          elif [ "${{ steps.release-type.outputs.type }}" = "minor" ]; then
            bun run version:minor
          else
            bun run version:patch
          fi

      - name: Generate changelog
        run: |
          NEW_VERSION=$(bun pm pkg get version | tr -d '"')
          echo "## v$NEW_VERSION ($(date +%Y-%m-%d))" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Changes" >> CHANGELOG.md
          git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")..HEAD | sed 's/^/- /' >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -f CHANGELOG.md.bak ]; then
            cat CHANGELOG.md.bak >> CHANGELOG.md
          fi

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v$(bun pm pkg get version | tr -d '"')" || echo "No changes to commit"

      - name: Create git tag
        run: |
          VERSION=$(bun pm pkg get version | tr -d '"')
          git tag "v$VERSION"

      - name: Push changes
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Create GitHub release
        if: ${{ github.event.inputs.create_github_release != false }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v$(bun pm pkg get version | tr -d '"')
          release_name: Release v$(bun pm pkg get version | tr -d '"')
          body: |
            ## Changes
            $(git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")..HEAD | sed 's/^/- /')
          draft: false
          prerelease: false

  # ============================================================================
  # GITHUB RELEASE (TAG-BASED)
  # ============================================================================

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build release artifacts
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Create release archives
        run: |
          # Create source archive
          git archive --format=tar.gz --prefix=windsurf-${{ github.ref_name }}/ -o windsurf-${{ github.ref_name }}.tar.gz HEAD

          # Create checksums
          sha256sum windsurf-${{ github.ref_name }}.tar.gz > windsurf-${{ github.ref_name }}.tar.gz.sha256

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            # Generate changelog between tags
            CHANGES=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          else
            # First release
            CHANGES=$(git log --pretty=format:"- %s (%h)" --max-count=20)
          fi

          # Escape newlines for GitHub output
          CHANGES="${CHANGES//'%'/'%25'}"
          CHANGES="${CHANGES//$'\n'/'%0A'}"
          CHANGES="${CHANGES//$'\r'/'%0D'}"

          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes in this release

            ${{ steps.changelog.outputs.changes }}

            ## Installation

            ### Using Bun
            ```bash
            bun add https://github.com/odds-protocol/windsurf/releases/download/${{ github.ref }}/windsurf-${{ github.ref }}.tar.gz
            ```

            ### Manual Installation
            Download the release archive and extract it to your project.

            ## Checksums

            ```
            $(cat windsurf-${{ github.ref_name }}.tar.gz.sha256)
            ```

            ## What's Changed

            This release includes bug fixes, performance improvements, and new features. See the [changelog](https://github.com/odds-protocol/windsurf/blob/main/CHANGELOG.md) for full details.

            ## Contributors

            Thank you to all contributors who helped with this release! 🎉
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windsurf-${{ github.ref_name }}.tar.gz
          asset_name: windsurf-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windsurf-${{ github.ref_name }}.tar.gz.sha256
          asset_name: windsurf-${{ github.ref_name }}.tar.gz.sha256
          asset_content_type: text/plain

      - name: Publish to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
            bun publish
          else
            echo "NPM_TOKEN not configured, skipping npm publish"
          fi

      - name: Notify release
        run: |
          VERSION=${{ github.ref_name }}
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{
              \"text\":\"🚀 Released $VERSION\",
              \"blocks\":[
                {
                  \"type\":\"section\",
                  \"text\":{\"type\":\"mrkdwn\",\"text\":\"🚀 *New Release: $VERSION*\"}
                },
                {
                  \"type\":\"section\",
                  \"fields\":[
                    {\"type\":\"mrkdwn\",\"text\":\"*Tag:* ${{ github.ref }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Branch:* ${{ github.ref }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*SHA:* ${{ github.sha }}\"}
                  ]
                }
              ]
            }" || echo "Slack notification failed"