name: Repository Health Check

on:
  schedule:
    # Run weekly on Wednesdays at 6 AM UTC
    - cron: '0 6 * * 3'
  workflow_dispatch:

jobs:
  repo-health:
    name: Repository Health Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Repository Structure Check
        run: |
          echo "## Repository Structure Analysis" >> health-report.md
          echo "" >> health-report.md

          # Check for required files
          REQUIRED_FILES=(
            "README.md"
            "CONTRIBUTING.md"
            "LICENSE"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            ".github/CODEOWNERS"
            ".github/workflows/ci-cd.yml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file - Present" >> health-report.md
            else
              echo "❌ $file - Missing" >> health-report.md
            fi
          done

          echo "" >> health-report.md

      - name: Branch Protection Check
        run: |
          echo "## Branch Protection" >> health-report.md

          # Check if main branch has protection
          if gh api repos/${{ github.repository }}/branches/main/protection > /dev/null 2>&1; then
            echo "✅ Main branch protection - Enabled" >> health-report.md
          else
            echo "⚠️ Main branch protection - Not configured" >> health-report.md
          fi

          echo "" >> health-report.md

      - name: Issue Template Analysis
        run: |
          echo "## Issue Management" >> health-report.md

          TEMPLATE_COUNT=$(find .github/ISSUE_TEMPLATE -name "*.md" | wc -l)
          echo "📋 Issue templates: $TEMPLATE_COUNT found" >> health-report.md

          if [ -f ".github/labeler.yml" ]; then
            echo "✅ Auto-labeling - Configured" >> health-report.md
          else
            echo "❌ Auto-labeling - Not configured" >> health-report.md
          fi

          echo "" >> health-report.md

      - name: CI/CD Analysis
        run: |
          echo "## CI/CD Pipelines" >> health-report.md

          WORKFLOW_COUNT=$(find .github/workflows -name "*.yml" | wc -l)
          echo "🔄 Workflows: $WORKFLOW_COUNT active" >> health-report.md

          # Check for key workflows
          WORKFLOWS=("ci-cd.yml" "security-scan.yml" "release.yml")
          for workflow in "${WORKFLOWS[@]}"; do
            if [ -f ".github/workflows/$workflow" ]; then
              echo "✅ $workflow - Present" >> health-report.md
            else
              echo "❌ $workflow - Missing" >> health-report.md
            fi
          done

          echo "" >> health-report.md

      - name: Community Health Metrics
        run: |
          echo "## Community Health" >> health-report.md

          # Get repository stats
          STARS=$(gh repo view ${{ github.repository }} --json stargazersCount -q .stargazersCount 2>/dev/null || echo "0")
          FORKS=$(gh repo view ${{ github.repository }} --json forkCount -q .forkCount 2>/dev/null || echo "0")

          echo "⭐ Stars: $STARS" >> health-report.md
          echo "🍴 Forks: $FORKS" >> health-report.md

          # Issue stats
          OPEN_ISSUES=$(gh issue list --state open --limit 1000 | wc -l)
          CLOSED_ISSUES=$(gh issue list --state closed --limit 1000 | wc -l)

          echo "📋 Open issues: $OPEN_ISSUES" >> health-report.md
          echo "✅ Closed issues: $CLOSED_ISSUES" >> health-report.md

          # PR stats
          OPEN_PRS=$(gh pr list --state open --limit 1000 | wc -l)
          MERGED_PRS=$(gh pr list --state merged --limit 1000 | wc -l)

          echo "🔄 Open PRs: $OPEN_PRS" >> health-report.md
          echo "✅ Merged PRs: $MERGED_PRS" >> health-report.md

          echo "" >> health-report.md

      - name: Security Analysis
        run: |
          echo "## Security Status" >> health-report.md

          # Check for security policy
          if [ -f "SECURITY.md" ]; then
            echo "✅ Security policy - Present" >> health-report.md
          else
            echo "❌ Security policy - Missing" >> health-report.md
          fi

          # Check for dependabot
          if [ -f ".github/dependabot.yml" ]; then
            echo "✅ Dependabot - Configured" >> health-report.md
          else
            echo "⚠️ Dependabot - Not configured" >> health-report.md
          fi

          # Check for code scanning
          if gh api repos/${{ github.repository }}/code-scanning/alerts > /dev/null 2>&1; then
            ALERTS=$(gh api repos/${{ github.repository }}/code-scanning/alerts | jq length)
            echo "🔍 Code scanning alerts: $ALERTS" >> health-report.md
          else
            echo "⚠️ Code scanning - Not enabled" >> health-report.md
          fi

          echo "" >> health-report.md

      - name: Recommendations
        run: |
          echo "## Recommendations" >> health-report.md
          echo "" >> health-report.md
          echo "### Immediate Actions" >> health-report.md
          echo "- Enable branch protection for main/develop branches" >> health-report.md
          echo "- Set up code scanning and security alerts" >> health-report.md
          echo "- Configure Dependabot for automated updates" >> health-report.md
          echo "" >> health-report.md
          echo "### Medium-term Goals" >> health-report.md
          echo "- Implement automated release process" >> health-report.md
          echo "- Set up community health monitoring" >> health-report.md
          echo "- Create contributor recognition program" >> health-report.md
          echo "" >> health-report.md
          echo "### Long-term Vision" >> health-report.md
          echo "- Achieve 95%+ test coverage" >> health-report.md
          echo "- Maintain < 24hr issue resolution time" >> health-report.md
          echo "- Build active contributor community" >> health-report.md

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: repo-health-report-${{ github.run_id }}
          path: health-report.md

      - name: Create health issue (if needed)
        if: failure()
        run: |
          echo "Repository health issues detected"
          # In a real implementation, this could create GitHub issues for health problems