name: 'Stale Issue Management'

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v11
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 14 days if no further activity occurs.

            If this issue is still relevant, please:
            - Add a comment explaining why this issue is still important
            - Update the issue with any new information
            - Remove the `stale` label

            Thank you for your contributions to Bun!

          close-issue-message: |
            This issue has been automatically closed due to inactivity. If you believe this issue is still relevant, please feel free to reopen it with additional information.

          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs.

            If you're still working on this PR, please:
            - Add a comment to indicate progress
            - Push new commits if ready
            - Request a review if the PR is complete

          close-pr-message: |
            This pull request has been automatically closed due to inactivity. If you're still working on this, please feel free to reopen it when ready.

          # Configuration
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'pinned,work-in-progress,wip'
          exempt-all-issue-milestones: true
          exempt-all-pr-milestones: true
          operations-per-run: 100