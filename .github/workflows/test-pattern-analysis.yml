name: Test Pattern Analysis
on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/**/*.test.ts'
      - 'examples/**/*.spec.ts'
      - 'tools/test-pattern-analyzer.ts'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**/*.test.ts'
      - 'examples/**/*.spec.ts'

env:
  NODE_ENV: test
  BUN_VERSION: "1.3.2"

jobs:
  test-pattern-analysis:
    name: Test Pattern Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test pattern analysis
        run: bun run tools/test-pattern-analyzer.ts

      - name: Check test quality thresholds
        run: |
          # Extract quality metrics from the report
          REPORT_FILE="test-pattern-analysis-report.md"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "❌ Test pattern analysis report not found"
            exit 1
          fi

          # Extract average score
          AVG_SCORE=$(grep "Average Test Quality Score:" "$REPORT_FILE" | sed 's/.*: \([0-9]*\).*/\1/')

          # Extract critical issues count
          CRITICAL_COUNT=$(grep -c "Critical Issues (0-49):" "$REPORT_FILE" | head -1)

          echo "📊 Average Test Quality Score: $AVG_SCORE"
          echo "🚨 Critical Issues: $CRITICAL_COUNT"

          # Quality gates
          if [ "$AVG_SCORE" -lt 70 ]; then
            echo "❌ Test quality too low: $AVG_SCORE/100 (minimum: 70)"
            echo "test_quality_failure=true" >> $GITHUB_ENV
          else
            echo "✅ Test quality acceptable: $AVG_SCORE/100"
          fi

          # Critical issues check
          if grep -q "Console Log in Tests" "$REPORT_FILE"; then
            echo "🚨 Found console.log in tests - critical issue"
            echo "console_log_issue=true" >> $GITHUB_ENV
          fi

          if grep -q "test.only" "$REPORT_FILE"; then
            echo "🚨 Found test.only usage - critical issue"
            echo "test_only_issue=true" >> $GITHUB_ENV
          fi

      - name: Upload analysis report
        uses: actions/upload-artifact@v3
        with:
          name: test-pattern-analysis
          path: |
            test-pattern-analysis-report.md
          retention-days: 30

      - name: Comment on PR with analysis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🧪 Test Pattern Analysis\n\n';
            comment += 'Automated analysis of test quality and patterns in your changes.\n\n';

            if (fs.existsSync('test-pattern-analysis-report.md')) {
              const report = fs.readFileSync('test-pattern-analysis-report.md', 'utf8');

              // Extract key metrics
              const avgScoreMatch = report.match(/\*\*Average Test Quality Score:\*\* (\d+)/);
              const filesMatch = report.match(/\*\*Test Files Analyzed:\*\* (\d+)/);

              if (avgScoreMatch && filesMatch) {
                const avgScore = parseInt(avgScoreMatch[1]);
                const filesCount = filesMatch[1];

                comment += `### 📊 Quality Metrics\n\n`;
                comment += `- **Files Analyzed**: ${filesCount}\n`;
                comment += `- **Average Quality Score**: ${avgScore}/100 ${avgScore >= 90 ? '🟢' : avgScore >= 70 ? '🟡' : '🔴'}\n\n`;

                // Add quality assessment
                if (avgScore >= 90) {
                  comment += '✅ **Excellent test quality!** All best practices followed.\n\n';
                } else if (avgScore >= 70) {
                  comment += '🟡 **Good test quality** with minor areas for improvement.\n\n';
                } else {
                  comment += '🔴 **Test quality needs attention** - review the issues below.\n\n';
                }

                // Extract top issues
                const issuesSection = report.match(/## 🚨 Most Common Issues\n\n([\s\S]*?)\n\n##/);
                if (issuesSection) {
                  comment += `### 🚨 Key Issues Found\n\n`;
                  const issues = issuesSection[1].split('\n').filter(line => line.trim()).slice(0, 5);
                  issues.forEach(issue => {
                    comment += `${issue}\n`;
                  });
                  comment += '\n';
                }
              }
            }

            comment += `### 📋 Recommendations\n\n`;
            comment += `- Remove \`console.log\` from test files\n`;
            comment += `- Avoid \`test.only()\` in committed code\n`;
            comment += `- Add proper assertions to all tests\n`;
            comment += `- Use setup/teardown for test isolation\n\n`;

            comment += `[View detailed analysis report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;

            comment += `*This analysis was automatically generated by the Test Pattern Analyzer CI*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  quality-gate-check:
    name: Test Quality Gate
    runs-on: ubuntu-latest
    needs: [test-pattern-analysis]
    if: always()

    steps:
      - name: Check test quality requirements
        run: |
          # This job will fail if quality gates are not met
          if [ "$test_quality_failure" = "true" ]; then
            echo "❌ TEST QUALITY GATE FAILED"
            echo ""
            echo "The following quality issues must be addressed:"
            echo "- Average test quality score below 70/100"
            echo ""
            echo "Please review the test pattern analysis report and fix the identified issues."
            exit 1
          fi

          if [ "$console_log_issue" = "true" ]; then
            echo "❌ CONSOLE.LOG IN TESTS DETECTED"
            echo ""
            echo "Critical Issue: console.log found in test files"
            echo "Replace console.log with proper assertions using expect()"
            exit 1
          fi

          if [ "$test_only_issue" = "true" ]; then
            echo "❌ TEST.ONLY USAGE DETECTED"
            echo ""
            echo "Critical Issue: test.only() found in committed code"
            echo "Remove .only() calls before committing"
            exit 1
          fi

          echo "✅ All test quality gates passed!"
          echo ""
          echo "Test quality standards are being maintained."

      - name: Quality gate passed
        run: |
          echo "🎉 Test Quality Assurance Complete"
          echo ""
          echo "✓ Automated pattern analysis completed"
          echo "✓ Quality thresholds verified"
          echo "✓ Critical anti-patterns checked"
          echo "✓ Test isolation and best practices validated"