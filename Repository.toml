# ========================================
# DOMAIN: http.server
# SCOPE: core/networking
# TYPE: specification
# STATUS: pr-merged #1234
# TAGS: critical, production-ready, v1.3.4
# ========================================

[http.server.bun-serve-advanced] # PR #1234 - Initial implementation
# COMMENT: Enterprise HTTP/2 server with TLS termination
# REVIEWED-BY: @bun-team-lead @security-team
# COMMIT: a1b2c3d4e5f6

[http.server.bun-serve-advanced.TYPE]
specification = "EX021"
validation = "@HTTP_SERVER"
implementation = "enterprise-grade"
# TAGS: performance, security, websocket-support

[http.server.bun-serve-advanced.META:{PROPERTY}]
# TLS Configuration - PR #1235 enhanced cipher suites
tls = {
  version = "1.3",
  cipher_suites = ["TLS_AES_128_GCM_SHA256", "TLS_AES_256_GCM_SHA384"],
  require_client_cert = false,
  # COMMENT: Using modern cipher suites only, see #security-review-45
  # STATUS: pr-approved #1235
  # COMMIT: g7h8i9j0k1l2
}

# HTTP/2 Support - PR #1236 added server push
http2 = {
  enabled = true,
  allow_http1 = true,
  server_push = true,
  # COMMENT: Server push disabled by default for now
  # STATUS: pr-draft #1236
  # TAGS: performance-experimental
}

# WebSocket Configuration - PR #1237 fixed memory leak
websocket = {
  upgrade_timeout_ms = 5000,
  max_payload_size_mb = 10,
  ping_interval_ms = 30000,
  # COMMENT: Memory leak fix in ping/pong handling
  # STATUS: pr-merged #1237
  # COMMIT: m3n4o5p6q7r8
  # TAGS: bugfix, memory-leak
}

# CORS & Security - PR #1238 added rate limiting
cors = {
  allowed_origins = ["https://trusted-domain.com"],
  max_age_seconds = 86400,
  # COMMENT: Origin list managed via config manager
  # STATUS: pr-approved #1238
  # TAGS: security, cors
}

rate_limiting = {
  requests_per_minute = 100,
  ip_whitelist = ["127.0.0.1"],
  # COMMENT: Configurable via BunConfigManager
  # STATUS: pr-merged #1239
  # TAGS: production-ready, rate-limit
}

# Security Headers - PR #1240 added CSP
security_headers = {
  hsts = "max-age=63072000",
  x_frame_options = "DENY",
  x_content_type_options = "nosniff",
  # COMMENT: CSP header pending security review
  # STATUS: pr-blocked #1240 (waiting security)
  # TAGS: security-pending
}

[http.server.bun-serve-advanced.CLASS]
class = "BunServeAdvanced"
methods = ["start", "stop", "handleRequest", "isRateLimited"]
implements = ["GracefulShutdown", "MetricsCollector"]
# COMMENT: Implements graceful shutdown interface from EX050
# TAGS: class-definition, interface-implementation

# REFERENCE: Cross-cutting concerns
[http.server.bun-serve-advanced.#REF:*]
# COMMENT: WebSocket integration with adapter pattern
references = ["EX031", "EX048"]  # Cookies & Sessions for auth
# COMMENT: HTTP/2 pushed resources via HTML bundler
references = ["EX049"]  # HTML bundle for server push
# COMMENT: Metrics collection via Prometheus
references = ["EX053"]  # Prometheus exporter
# COMMENT: Graceful shutdown integration
references = ["EX050"]  # Shutdown handler
# COMMENT: Tracing integration for requests
references = ["EX062"]  # OpenTelemetry
# COMMENT: Rate limiting uses Redis backend
references = ["EX074"]  # Rate limiter

