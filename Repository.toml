# REVIEWED-BY: @build-team @performance-team
# COMMIT: s9t0u1v2w3x4

[build.bundler.bun-build-pipeline.TYPE]
specification = "EX022"
validation = "@BUILD"
implementation = "production"
# TAGS: bundler, plugin, performance

[build.bundler.bun-build-pipeline.META:{PROPERTY}]
# COMMENT: Multiple entry points for micro-frontend support
entry_points = [
  "src/index.ts",
  "src/secondary.ts",
  # NEW: Added admin entry point in PR #1242
  # STATUS: pr-reviewed #1242
  "src/admin.ts"
]
output_dir = "dist/"

# TARGET Configuration - PR #1243 enhanced browser targets
target = {
  environment = "browser",
  compatibility = ["chrome60", "firefox60", "safari12"],
  # COMMENT: Added Edge support
  # STATUS: pr-merged #1243
  # COMMIT: y5z6a7b8c9d0
  # TAGS: compatibility-update
}

# Minification - PR #1244 upgraded terser
minification = {
  enabled = true,
  keep_names = false,
  drop_console = true,
  # COMMENT: Terser v5.19.2 integration
  # STATUS: pr-merged #1244
  # TAGS: performance, deps-upgrade
}

# Source Maps - PR #1245 external maps for production
source_maps = {
  enabled = true,
  type = "external",
  inline_sources = false,
  # COMMENT: External maps reduce bundle size by 15%
  # STATUS: pr-approved #1245
  # TAGS: performance, debugging
}

# Code Splitting - PR #1246 dynamic imports
splitting = {
  enabled = true,
  chunk_size_threshold_kb = 50,
  # COMMENT: Dynamic import() splitting for routes
  # STATUS: pr-draft #1246
  # TAGS: code-split, performance-experimental
}

# Plugin API - PR #1247 stable plugin interface
plugins = [
  "define-env",
  "css-import",
  "svg-inline",
  # COMMENT: Plugin API now stable, see docs/plugins.md
  # STATUS: pr-merged #1247
  # COMMIT: e1f2g3h4i5j6
  # TAGS: plugin-api-stable, breaking-change
]
define = {
  "process.env.NODE_ENV": '"production"',
  "__VERSION__": '"1.0.0"',
  # COMMENT: Build-time constants from package.json
  # STATUS: pr-merged #1248
  # TAGS: build-time-config
}

[build.bundler.bun-build-pipeline.CLASS]
class = "BunBuildPipeline"
methods = ["build", "watch", "getStats", "applyPlugins"]
extends = "EventEmitter"

[build.bundler.bun-build-pipeline.#REF:*]
references = ["EX023", "EX047", "EX049"]
dependencies = ["loader.bun-plugin-system", "cache.bun-build-cache"]
benchmarks = ["benchmarks/bundler-speed.bench.ts"]

