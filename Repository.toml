# ========================================
# DOMAIN: http.server
# ========================================

[http.server.bun-serve-advanced]
[http.server.bun-serve-advanced.TYPE]
specification = "EX021"
validation = "@HTTP_SERVER"
implementation = "enterprise-grade"

[http.server.bun-serve-advanced.META:{PROPERTY}]
tls = { version = "1.3", cipher_suites = ["TLS_AES_128_GCM_SHA256", "TLS_AES_256_GCM_SHA384"], require_client_cert = false }
http2 = { enabled = true, allow_http1 = true, server_push = true }
websocket = { upgrade_timeout_ms = 5000, max_payload_size_mb = 10, ping_interval_ms = 30000 }
cors = { allowed_origins = ["https://trusted-domain.com"], max_age_seconds = 86400 }
rate_limiting = { requests_per_minute = 100, ip_whitelist = ["127.0.0.1"] }
security_headers = { hsts = "max-age=63072000", x_frame_options = "DENY", x_content_type_options = "nosniff" }

[http.server.bun-serve-advanced.CLASS]
class = "BunServeAdvanced"
methods = ["start", "stop", "handleRequest", "isRateLimited"]
implements = ["GracefulShutdown", "MetricsCollector"]

[http.server.bun-serve-advanced.#REF:*]
references = ["EX022", "EX031", "EX050"]
dependencies = ["validation.@HTTP_SERVER", "logger.bun-native-logger"]
benchmarks = ["benchmarks/http-server.bench.ts"]

# ========================================
# DOMAIN: build.bundler
# ========================================

[build.bundler.bun-build-pipeline]
[build.bundler.bun-build-pipeline.TYPE]
specification = "EX022"
validation = "@BUILD"
implementation = "production"

[build.bundler.bun-build-pipeline.META:{PROPERTY}]
entry_points = ["src/index.ts", "src/secondary.ts"]
output_dir = "dist/"
target = { environment = "browser", compatibility = ["chrome60", "firefox60", "safari12"] }
minification = { enabled = true, keep_names = false, drop_console = true }
source_maps = { enabled = true, type = "external", inline_sources = false }
splitting = { enabled = true, chunk_size_threshold_kb = 50 }
plugins = ["define-env", "css-import", "svg-inline"]
define = { "process.env.NODE_ENV": '"production"', "__VERSION__": '"1.0.0"' }

[build.bundler.bun-build-pipeline.CLASS]
class = "BunBuildPipeline"
methods = ["build", "watch", "getStats", "applyPlugins"]
extends = "EventEmitter"

[build.bundler.bun-build-pipeline.#REF:*]
references = ["EX023", "EX047", "EX049"]
dependencies = ["loader.bun-plugin-system", "cache.bun-build-cache"]
benchmarks = ["benchmarks/bundler-speed.bench.ts"]

