[test]
preload = ["./src/test-setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageThreshold = { lines = 0.8, functions = 0.8, statements = 0.8, branches = 0.75 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "node_modules/",
  "src/test-setup.ts",
  "**/*.d.ts",
  "**/*.config.*",
  "dist/"
]
coverageDir = "coverage"