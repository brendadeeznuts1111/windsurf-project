# Fly.io deployment configuration for Bun Dashboard
# This configuration deploys both the React frontend and Bun API server

app = "bun-dashboard"
primary_region = "iad"

[build]
  # Use Docker for building and running
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Health checks
[checks]
  [checks.health]
    port = 3000
    type = "http"
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

# Static file serving for the React app
[[statics]]
  guest_path = "/app/dist"
  url_prefix = "/"

# API routes - all /api/* routes go to the Bun server
[[http_service.routes]]
  source = { path = "/api" }
  destination = { port = 3000 }

# WebSocket routes
[[http_service.routes]]
  source = { path = "/ws" }
  destination = { port = 3000 }

# Health check route
[[http_service.routes]]
  source = { path = "/health" }
  destination = { port = 3000 }

# Static assets (CSS, JS, images)
[[http_service.routes]]
  source = { path = "/assets" }
  destination = { port = 3000 }

# Catch-all for React SPA routing
[[http_service.routes]]
  source = { path = "/" }
  destination = { port = 3000 }