# Azure Pipelines CI/CD for Odds Protocol
# Triggered on push to main and pull requests

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'apps/**'
      - 'packages/**'
      - 'azure-pipelines.yml'

pr:
  branches:
    include:
      - main
  paths:
    include:
      - 'apps/**'
      - 'packages/**'

variables:
  BUN_VERSION: '1.3.4'
  NODE_ENV: 'test'

stages:
  # ===== BUILD & TEST STAGE =====
  - stage: BuildAndTest
    displayName: 'Build & Test'
    jobs:
      # ----- Core Package Tests -----
      - job: CoreTests
        displayName: 'Core Package Tests'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 10
        steps:
          - task: UseNode@1
            inputs:
              version: '20.x'
            displayName: 'Install Node.js (for Bun)'

          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun $(BUN_VERSION)'

          - script: bun install
            displayName: 'Install dependencies'

          - script: |
              cd packages/odds-core
              bun test
            displayName: 'Run odds-core tests'

          - script: |
              cd packages/odds-websocket
              bun test
            displayName: 'Run odds-websocket tests'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              mergeTestResults: true
            condition: always()
            displayName: 'Publish Test Results'

      # ----- Dashboard Tests -----
      - job: DashboardTests
        displayName: 'Dashboard Tests'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 12
        steps:
          - task: UseNode@1
            inputs:
              version: '20.x'
            displayName: 'Install Node.js'

          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun'

          - script: |
              cd apps/dashboard
              bun install
            displayName: 'Install dashboard dependencies'

          - script: |
              cd apps/dashboard
              bunx tsc --noEmit
            displayName: 'TypeScript check'

          - script: |
              cd apps/dashboard
              bun run lint
            displayName: 'Lint code'
            continueOnError: true

          - script: |
              cd apps/dashboard
              bun run test:all
            displayName: 'Run all tests'

          - script: |
              cd apps/dashboard
              bun run build
            displayName: 'Build dashboard'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'apps/dashboard/dist'
              artifactName: 'dashboard-build'
            displayName: 'Publish build artifact'

      # ----- Security Scan -----
      - job: SecurityScan
        displayName: 'Security Scan'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 8
        steps:
          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun'

          - script: bun install
            displayName: 'Install dependencies'

          - script: |
              cd apps/dashboard
              bun audit || true
            displayName: 'Security audit'

          - script: |
              echo "Checking for hardcoded secrets..."
              if grep -rE "(password|secret|api_key|token)\s*=\s*['\"][^'\"]+['\"]" apps/ packages/ --include="*.ts" --include="*.tsx" | grep -v "process.env" | grep -v "import.meta.env" | grep -v ".example"; then
                echo "##vso[task.logissue type=warning]Potential hardcoded secrets found"
              fi
            displayName: 'Check for secrets'

  # ===== INTEGRATION TEST STAGE =====
  - stage: IntegrationTests
    displayName: 'Integration Tests'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: IntegrationTest
        displayName: 'Integration Tests'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 15
        steps:
          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun'

          - script: |
              cd apps/dashboard
              bun install
              bun run build
            displayName: 'Build dashboard'

          - script: |
              cd apps/dashboard
              bun run prod:server &
              sleep 5
              curl -f http://localhost:3000/health || exit 1
              curl -f http://localhost:3000/api/health || exit 1
              echo "Health checks passed"
            displayName: 'Start server and health check'

          - script: |
              cd apps/dashboard
              bun run test:integration
            displayName: 'Run integration tests'

  # ===== PERFORMANCE TEST STAGE =====
  - stage: PerformanceTests
    displayName: 'Performance Tests'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: PerformanceTest
        displayName: 'Performance Benchmarks'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 15
        steps:
          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun'

          - script: |
              cd packages/odds-websocket
              bun install
              bun run test:performance
            displayName: 'WebSocket performance tests'

          - script: |
              cd apps/dashboard
              bun install
              bun run test:performance
            displayName: 'Dashboard performance tests'

          - script: |
              cd apps/dashboard
              bun run build
              SIZE=$(du -sh dist/ | cut -f1)
              echo "Bundle size: $SIZE"
              if [ $(du -sm dist/ | cut -f1) -gt 50 ]; then
                echo "##vso[task.logissue type=error]Bundle size too large: $SIZE"
                exit 1
              fi
            displayName: 'Bundle size check'

  # ===== DEPLOYMENT STAGE =====
  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn:
      - IntegrationTests
      - PerformanceTests
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Fly.io'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    curl -fsSL https://bun.sh/install | bash
                    echo "##vso[task.prependpath]$HOME/.bun/bin"
                  displayName: 'Install Bun'

                - script: |
                    cd apps/dashboard
                    bun install
                    bun run build
                  displayName: 'Build for production'

                - script: |
                    curl -L https://fly.io/install.sh | sh
                    echo "##vso[task.prependpath]$HOME/.fly/bin"
                  displayName: 'Install Fly CLI'

                - script: |
                    cd apps/dashboard
                    fly deploy --remote-only
                  displayName: 'Deploy to Fly.io'
                  env:
                    FLY_API_TOKEN: $(FLY_API_TOKEN)

                - script: |
                    sleep 30
                    curl -f https://bun-dashboard.fly.dev/health || exit 1
                    echo "Deployment verified successfully"
                  displayName: 'Verify deployment'
