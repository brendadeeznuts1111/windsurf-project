# Azure Pipelines CI/CD for Odds Protocol
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  BUN_VERSION: '1.3.4'

steps:
  - script: |
      curl -fsSL https://bun.sh/install | bash
      echo "##vso[task.prependpath]$HOME/.bun/bin"
    displayName: 'Install Bun'

  - script: bun --version
    displayName: 'Verify Bun installation'

  - script: bun install
    displayName: 'Install dependencies'

  - script: |
      cd packages/odds-core
      bun test || true
    displayName: 'Run odds-core tests'

  - script: |
      cd apps/dashboard
      bun install
      bunx tsc --noEmit || true
    displayName: 'TypeScript check'

  - script: |
      cd apps/dashboard
      bun run build
    displayName: 'Build dashboard'
