# Azure Artifacts npm registry configuration
[install.registry]
url = "https://pkgs.dev.azure.com/brendawill2233/_packaging/brendawill2233/npm/registry"
username = "brendawill2233"
# Personal Access Token - DO NOT base64 encode, Bun handles this automatically
password = "$NPM_PASSWORD"

[install]
# Use lockfile for reproducible installs
frozen = false

[test]
# Global test timeout (30 seconds)
timeout = 30000

# Test file patterns
include = ["**/*.{test,spec}.ts", "**/*.test.tsx"]

# Preload test setup
preload = ["./global-test-setup.ts"]

# Concurrent testing configuration
# Run integration and API tests concurrently for better performance
concurrentTestGlob = [
  "**/integration/**/*.test.ts",
  "**/api/**/*.test.ts",
  "**/*-concurrent.test.ts",
  "**/benchmarks/**/*.test.ts"
]

# Maximum concurrent tests (default: 20, increase for I/O heavy tests)
maxConcurrency = 50

[run]
# Console inspection depth for debugging (default: 2)
console.depth = 4
