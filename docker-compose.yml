version: '3.8'

services:
  windsurf:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BUN_DEBUG=0
    volumes:
      - ./settings.local.json:/app/settings.local.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "run", "examples/index.ts", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Add a reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - windsurf
    restart: unless-stopped