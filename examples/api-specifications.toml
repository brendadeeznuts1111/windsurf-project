# STATUS: pr-merged #1234
# TAGS: critical, production-ready, v1.3.4, security, performance
[http.server.bun-serve-advanced]
[http.server.bun-serve-advanced.TYPE]
specification = "EX001"
validation = "@VALIDATION_HTTP_SERVER"
implementation = "TYPE_LEVEL"

[http.server.bun-serve-advanced.META:{PROPERTY}]
server = {
  port = 8443, # Default secure port for TLS termination
  hostname = "0.0.0.0", # Bind to all interfaces for container deployment
  max_request_body_size = 10485760, # 10MB - prevents DoS via large uploads
  idle_timeout = 30, # 30s - balances performance vs resource usage
  development = false, # Production defaults prioritize security over convenience
}

websocket = {
  upgrade_path = "/ws", # Standard WebSocket endpoint for composability
  client_id_generation = "uuidv7", # Cryptographically secure client tracking
  message_buffering = true, # Prevents backpressure issues in high-throughput scenarios
}

security = {
  cors_origins = ["https://trusted-domain.com"], # Explicit allowlist prevents CSRF
  hsts_max_age = 63072000, # 2 years - industry standard for HTTPS enforcement
  security_headers = ["strict-transport-security", "x-content-type-options", "x-frame-options", "x-xss-protection"], # OWASP recommended headers
  rate_limiting_enabled = true, # Prevents abuse but allows legitimate traffic
}

observability = {
  request_logging = true, # Essential for debugging distributed systems
  performance_metrics = true, # P99 latency tracking for SLA compliance
  health_endpoint = "/health", # Kubernetes readiness/liveness probes
  metrics_endpoint = "/metrics", # Prometheus scraping integration
}

[http.server.bun-serve-advanced.CLASS]
class = "BunServeAdvanced"
methods = ["start", "stop", "isRateLimited", "handleRequest", "collectMetrics"]
implements = ["ServerLifecycle", "WebSocketHandler", "MetricsProvider"]
# Core HTTP/2 server with WebSocket upgrade, security headers, and observability. Manages request lifecycle from TLS termination through response generation, ensuring sub-millisecond routing and comprehensive security controls.

[http.server.bun-serve-advanced.#REF:*]
references = ["EX002", "EX003", "EX004", "EX005", "EX006", "EX007"]
dependencies = ["logging.bun-logger", "websocket.upgrade-handler", "metrics.prometheus-client"]
benchmarks = ["benchmarks/bun-http-server.bench.ts", "benchmarks/bun-websocket-throughput.bench.ts"]

# STATUS: pr-blocked #1240
