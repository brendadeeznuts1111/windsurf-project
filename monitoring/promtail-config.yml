server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: windsurf-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: windsurf-api
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
      - labels:
          level:
          job:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) - (?P<user>\S+) \[(?P<timestamp>[\w:/]+\s[+\-]\d{4})\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<size>\d+) "(?P<re_referer>.*?)" "(?P<user_agent>.*?)"$'
      - labels:
          method:
          status:
          job:
      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'
      - output:
          source: path